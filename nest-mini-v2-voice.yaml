substitutions:
  # Phases of the Voice Assistant
  # The voice assistant is ready to be triggered by a wake word
  voice_assist_idle_phase_id: '1'
  # The voice assistant is waiting for a voice command (after being triggered by the wake word)
  voice_assist_waiting_for_command_phase_id: '2'
  # The voice assistant is listening for a voice command
  voice_assist_listening_for_command_phase_id: '3'
  # The voice assistant is currently processing the command
  voice_assist_thinking_phase_id: '4'
  # The voice assistant is replying to the command
  voice_assist_replying_phase_id: '5'
  # The voice assistant is not ready
  voice_assist_not_ready_phase_id: '10'
  # The voice assistant encountered an error
  voice_assist_error_phase_id: '11'
  # Change this to true in case you ahve a hidden SSID at home.
  hidden_ssid: "false"
  # Abschluss: die Verweise ${device_name} (AP-SSID) und ${friendly_name}
  #     (Neustart-Knoepfe) liefen seit F4 ins Leere - hier wieder definiert.
  device_name: nest-mini-v2
  friendly_name: Nest Mini v2

esphome:
  # F4: Name und Anzeigename ersetzt. Den Anzeigenamen habe ich aus dem Geraetenamen
  #     abgeleitet - falls er anders lauten soll, ist es diese eine Zeile.
  name: nest-mini-v2
  friendly_name: Nest Mini v2
  # K-B10: mit dieser Version uebersetzt und geprueft (ESPHome 2026.9.0 -> ESP-IDF 5.5.5
  #     ueber framework: version: recommended). Voice PE d4e6fa4: ebenso.
  min_version: 2026.9.0
  on_boot:
    - then:
      - light.turn_on:
          id: led_ring
          effect: slow_pulse
          red: 100%
          green: 60%
          blue: 0%
      - wait_until:
          condition:
            wifi.connected:
      - light.turn_on:
          id: led_ring
          effect: pulse
          red: 0%
          green: 100%
          blue: 0%
      - wait_until:
          condition:
            api.connected:
      - light.turn_on:
          id: led_ring
          effect: none
          red: 0%
          green: 100%
          blue: 0%
      - delay: 1s
      - script.execute: reset_led
    # MPR121: nur ELE0-ELE2 messen. ESPHome schaltet die Elektroden als Bereich 0..n ein und
    # setzt n mindestens auf 3 (mpr121/__init__.py: max_touch_channel = 3; ECR = 0x80 | (n + 1)
    # = 0x84), misst also auch ELE3. ELE3-ELE11 liegen auf einem gemeinsamen Netz mit R73
    # (1 MOhm) nach GND, wie in der Gen1-Basis 7de6eec6. Datenblatt MPR121 Rev. 4 (02/2013),
    # Abschnitt 5.11: nur die benutzten Kanaele einschalten spart Abtastzeit; nicht
    # eingeschaltete Elektroden sind hochohmig (Abschnitt GPIO, S. 20). ECR 0x83 = CL 10,
    # ELE0-ELE2. Erst in den Stop Mode (0x00), dann in den Run Mode; nach dem setup() der
    # Komponente, das ECR nach 100 ms schreibt.
    - priority: -100
      then:
        - delay: 500ms
        - lambda: |-
            if (!id(mpr121_component).is_failed()) {
              id(mpr121_component).write_byte(0x5E, 0x00);
              id(mpr121_component).write_byte(0x5E, 0x83);
            }


# Pin-Audit U8-B6: auf der Platine belegt, in dieser Firmware absichtlich ungenutzt (Reserve, nach
# Reset hochohmig):
#   GPIO3  QSPI_CLK, GPIO4 QSPI_D0   -> XU316-Boot-Flash U11, nie treiben (siehe U10-B7)
#   GPIO39 XMOS_SPI_CS_N, GPIO40 XMOS_SPI_MISO -> ueber U16, nur bei XU316_RST = 1 durchgeschaltet
#   GPIO9  IR_RX (R79 10k Pull-up), GPIO48 IR_TX, GPIO11 UART_RX, GPIO12 UART_TX -> J6 (Erweiterung)
# XMOS-Update: I2C-DFU ueber voice_kit; Erstprogrammierung XU316: JTAG J4 (firmware/xmos/README.md).
esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

      # Moves instructions and read only data from flash into PSRAM on boot.
      # Both enabled allows instructions to execute while a flash operation is in progress without needing to be placed in IRAM.
      # Considerably speeds up mWW at the cost of using more PSRAM.
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"

      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"  # TLS1.3 support isn't enabled by default in IDF 5.1.5

wifi:
  id: wifi_id
  ssid: !secret ssid
  password: !secret wifi_pass
  output_power: 8.5dB
  power_save_mode: none
  reboot_timeout: 10min
  # BLE-Improv wie Voice PE (home-assistant-voice.factory.yaml, d4e6fa43d6): nach der
  # Verbindung Bluetooth aus (5 s fuer die Improv-Rueckmeldung), bei Verlust wieder an.
  on_connect:
    - delay: 5s
    - ble.disable:
    - script.execute: control_leds
  on_disconnect:
    - ble.enable:
  # F4: feste Adresse entfernt, das Geraet holt sie sich per DHCP. Die Eintraege
  #     dns1 und dns2 in secrets.yaml werden damit nicht mehr gebraucht.
  ap:
    ssid: "${device_name}"
    password: !secret wifi_pass

captive_portal:

# WLAN-Einrichtung ueber Bluetooth (Improv), Freigabe durch Beruehren der mittleren Taste
# (MPR121 Kanal 1, id action) - wie Voice PE `authorizer: center_button`.
esp32_ble:
  name: ${device_name}

esp32_improv:
  authorizer: action
  on_start:
    - lambda: id(improv_ble_in_progress) = true;
    - script.execute: control_leds
  on_provisioned:
    - lambda: id(improv_ble_in_progress) = false;
    - script.execute: control_leds
  on_stop:
    - lambda: id(improv_ble_in_progress) = false;
    - script.execute: control_leds

web_server:
  port: 80

logger:

ota:
  platform: esphome

api:
  id: api_id
  encryption:
    key: !secret api_key
  reboot_timeout: 10min
  services:
    - service: start_va
      then:
        - voice_assistant.start
    - service: stop_va
      then:
        - voice_assistant.stop
    - service: notification_on
      then:
        - script.execute: turn_on_notification
    - service: notification_clear
      then:
        - script.execute: clear_notification

button:
  # XMOS-Erstbespielung/Wiederherstellung ueber den Bus (xmos_flasher). Zweistufig: erst den
  # Schalter "XMOS-Flash freigeben" einschalten (faellt nach 60 s von selbst zurueck), dann diese
  # Taste. Nie beim Start. Abgelehnt, wenn die Endstufe keine PVDD meldet (Betrieb nur an USB) oder
  # schon ein Schreibvorgang laeuft. Siehe firmware/esphome/components/xmos_flasher/README.md.
  - platform: template
    id: xmos_flash_schreiben
    name: "XMOS-Flash schreiben"
    icon: "mdi:chip"
    entity_category: config
    on_press:
      - if:
          condition:
            and:
              - switch.is_on: xmos_flash_freigabe
              - not:
                  xmos_flasher.in_progress: xmos_flasher_component
              # 14 V vorhanden: Endstufe eingerichtet und keine PVDD-Unterspannung (PVDD nur aus +14V).
              # Bei leerem U11 laeuft der XU316 nicht; tas58xx wird dann ohne I2S-Takt eingerichtet
              # (I2C geht trotzdem) - am Muster nachweisen (HANDGRIFFE 6.8).
              - lambda: |-
                  if (id(tas5805m_dac).is_failed()) {
                    ESP_LOGW("xmos_flasher", "Abgelehnt: Endstufe nicht eingerichtet (14 V nicht belegbar)");
                    return false;
                  }
                  if (id(endstufe_pvdd_uv).state) {
                    ESP_LOGW("xmos_flasher", "Abgelehnt: PVDD-Unterspannung - nur USB, keine 14 V");
                    return false;
                  }
                  return true;
          then:
            - switch.turn_off: xmos_flash_freigabe
            - micro_wake_word.stop:
            - voice_assistant.stop:
            - media_player.stop: external_media_player
            - delay: 500ms
            - xmos_flasher.write: xmos_flasher_component
          else:
            - logger.log:
                level: WARN
                format: "XMOS-Flash abgelehnt: Freigabe aus, Schreibvorgang laeuft, oder keine 14 V (PVDD)"
  - platform: restart
    name: "${friendly_name} Neustart"
  - platform: safe_mode
    name: "${friendly_name} Neustart (Sicherheitsmodus)"

i2c:
  - id: internal_i2c
    sda: GPIO5
    scl: GPIO6
    frequency: 400kHz

psram:
  mode: octal
  speed: 80MHz
  # U8-B12/M13: ESP32-S3R8 ohne PSRAM-ECC nur bis 65 °C Umgebung, mit ECC bis 85 °C
  # (Datenblatt v2.2, Tab. 1-1, Fussnote 3); nutzbares PSRAM dann 7,5 statt 8 MB.
  # Setzt CONFIG_SPIRAM_ECC_ENABLE (ESP-IDF 5.5.5, esp_psram/esp32s3/Kconfig.spiram, nur Octal;
  # ESPHome psram/__init__.py Z. 195, 257-258). Einschalten, wenn die Inbetriebnahme-Messung M-T
  # im geschlossenen Gehaeuse mehr als 53 °C (bei 23 °C Raum) ergibt.
  # enable_ecc: true

sensor:
  # U8-B12/M13: Chiptemperatur fuer die Inbetriebnahme-Messung M-T (Die-Temperatur, nicht Umgebung)
  - platform: internal_temperature
    name: "ESP32 Chiptemperatur"
    entity_category: diagnostic
    update_interval: 60s

globals:
  # Global index for our LEDs. So that switching between different animation does not lead to unwanted effects.
  - id: global_led_animation_index
    type: int
    restore_value: no
    initial_value: '0'
  # Global initialization variable. Initialized to true and set to false once everything is connected. Only used to have a smooth "plugging" experience
  - id: init_in_progress
    type: bool
    restore_value: no
    initial_value: 'true'
  # Global variable storing the state of ImprovBLE. Used to draw different LED animations
  - id: improv_ble_in_progress
    type: bool
    restore_value: no
    initial_value: 'false'
  # Global variable tracking the phase of the voice assistant (defined above). Initialized to not_ready
  - id: voice_assistant_phase
    type: int
    restore_value: no
    initial_value: ${voice_assist_not_ready_phase_id}
  # Global variable tracking if the dial was recently touched.
  - id: color_changed
    type: bool
    restore_value: no
    initial_value: 'false'
  # Global variable tracking if the jack has been plugged touched.
  - id: first_active_timer
    type: voice_assistant::Timer
    restore_value: false
  # Global variable storing if a timer is active
  - id: is_timer_active
    type: bool
    restore_value: false
  - id: notification
    type: bool
    restore_value: false
  - id: dial_touched
    type: bool
    restore_value: no
    initial_value: 'false'


switch:
  - platform: template
    id: xmos_flash_freigabe
    name: "XMOS-Flash freigeben"
    icon: "mdi:shield-alert-outline"
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: 60s
      - switch.turn_off: xmos_flash_freigabe
  # This is the master mute switch. It is exposed to Home Assistant. The user can only turn it on and off if the hardware switch is off. (The hardware switch overrides the software one)
  - platform: template
    id: master_mute_switch
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:microphone-off"
    name: Stummschalten
    entity_category: config
    lambda: |-
      // Muted either if the hardware mute switch is on or the microphone's software mute switch is enabled
      if (id(hardware_mute_switch).state || id(i2s_mics).get_mute_state()) {
        return true;
      } else {
        return false;
      }
    turn_on_action:
      - if:
          condition:
            binary_sensor.is_off: hardware_mute_switch
          then:
            - microphone.mute:
    turn_off_action:
      - if:
          condition:
            binary_sensor.is_off: hardware_mute_switch
          then:
            - microphone.unmute:
    on_turn_on:
      - script.execute: control_leds
    on_turn_off:
      - script.execute: control_leds
  # Wake Word Sound Switch.
  - platform: template
    id: wake_sound
    name: Weckton
    icon: "mdi:bullhorn"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  # Internal switch to track when a timer is ringing on the device.
  - platform: template
    id: timer_ringing
    optimistic: true
    internal: true
    restore_mode: ALWAYS_OFF
    on_turn_off:
      # Disable stop wake word
      - micro_wake_word.disable_model: stop
      - script.execute: disable_repeat
      # Stop any current annoucement (ie: stop the timer ring mid playback)
      - if:
          condition:
            media_player.is_announcing:
          then:
            media_player.stop:
              announcement: true
      # Set back ducking ratio to zero
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 0
          duration: 1.0s
      # Refresh the LED ring
      - script.execute: control_leds
    on_turn_on:
      # Duck audio
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s
      # Enable stop wake word
      - micro_wake_word.enable_model: stop
      # Ring timer
      - script.execute: ring_timer
      # Refresh LED
      - script.execute: control_leds
      # If 15 minutes have passed and the timer is still ringing, stop it.
      - delay: 15min
      - switch.turn_off: timer_ringing
  - platform: template
    name: Weckwort verwenden
    id: use_wake_word
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: turn_on_wake_word
    on_turn_off:
      - script.execute: turn_off_wake_word
  - platform: template
    name: Leuchte beim Warten auf das Weckwort
    id: flicker_wake_word
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: reset_led
    on_turn_off:
      - script.execute: reset_led

# E1: Touch ueber den MPR121 (U15, I2C 0x5A). Kein IRQ-Pin: die ESPHome-Komponente
#     `mpr121` kennt **keine** Option fuer einen Interrupt-Pin (esphome.io, Abruf
#     30.09.2026 - der Hub nimmt nur address, id, touch_debounce, release_debounce,
#     touch_threshold, release_threshold); sie fragt den Baustein ueber I2C ab.
#     Kanaele: 0 = links (ELEC0, TOUCH_L), 1 = Mitte (ELEC1, TOUCH_C),
#     2 = rechts (ELEC2, TOUCH_R). Vorher esp32_touch auf GPIO2/3/4 (a4db7a09) -
#     GPIO2 ist jetzt TOUCH_IRQ und darf nicht als Touch-Pin laufen.
#
#     Befund 11: Der IRQ des MPR121 ist ein Open-Collector-Ausgang und hat auf der
#     Platine keinen Pull-up - in Gen1 genauso (dort `/ESP32-S3R8/TOUCH_IRQ` = U2.1
#     und U6.7, ohne Widerstand). Ohne Pull-up bliebe GPIO2 ein offener Eingang.
#     Der interne Pull-up des ESP32-S3 uebernimmt das: R_PU typisch **45 kOhm**
#     (ESP32-S3 Series Datasheet v2.2, Tabelle 5-4 "DC Characteristics", S. 65).
#     Der Sensor unten dient nur dazu, diesen Pull-up zu setzen; ausgewertet wird
#     der Pegel nicht, darum `internal: true`.
mpr121:
  id: mpr121_component
  address: 0x5A
  i2c_id: internal_i2c
  touch_debounce: 1
  release_debounce: 1
  touch_threshold: 12
  release_threshold: 6

binary_sensor:
  # FAULT (Pin-Audit U14-B11): Der ADR/FAULT-Pin des TAS5805M ist nicht zum ESP32
  # gefuehrt (U14.3 traegt nur R70 fuer die Adresse). Die Fehler werden deshalb ueber
  # I2C aus den Fehlerregistern gelesen (tas58xx binary_sensor, 1-s-Abfrage).
  # Schluesselnamen wie im Baustein (dort u. a. "pcdd" statt "pvdd").
  - platform: tas58xx
    have_fault:
      name: "Endstufe Fehler"
    left_channel_over_current:
      name: "Endstufe Ueberstrom links"
    right_channel_over_current:
      name: "Endstufe Ueberstrom rechts"
    left_channel_dc_fault:
      name: "Endstufe DC-Fehler links"
    right_channel_dc_fault:
      name: "Endstufe DC-Fehler rechts"
    pcdd_under_voltage:
      id: endstufe_pvdd_uv
      name: "Endstufe PVDD Unterspannung"
    pcdd_over_voltage:
      name: "Endstufe PVDD Ueberspannung"
    over_temp_warning:
      name: "Endstufe Temperaturwarnung"
    over_temp_shutdown:
      name: "Endstufe Uebertemperatur"
  # Befund 11: haelt GPIO2 (TOUCH_IRQ) ueber den internen Pull-up auf definiertem
  # Pegel. Der MPR121-IRQ zieht aktiv nach Masse, gibt High aber nur passiv frei.
  - platform: gpio
    id: touch_irq
    internal: true
    pin:
      number: GPIO2
      mode:
        input: true
        pullup: true
      inverted: true

  - platform: gpio
    id: hardware_mute_switch
    internal: true
    pin:
      # F2: Der Mute-Schalter meldet sich auf GPIO1 (ESP_MUTE_DET, ueber D6 von
      #     U12.2Y). R58 zieht die Leitung bereits nach ESP_3V3 hoch, ein zweiter
      #     Pull-Up im Baustein ist unnoetig. GPIO33 ist unbeschaltet.
      # D3: Polaritaet geklaert, KEIN 'inverted:' noetig. Laut Schaltplan gilt:
      #     MUTE_ON hoch = stumm; Q3 schaltet dann VDD_MIC ab,
      #     und ESP_MUTE_DET geht ueber D6 ebenfalls hoch. Hoher Pegel an GPIO1
      #     heisst also stumm - genau die Bedeutung, die on_press erwartet.
      number: GPIO1
      mode: INPUT
    on_press:
      # Play mute on sound only if software mute isn't enabled
      - if:
          condition:
            - switch.is_off: master_mute_switch
          then:
            - script.execute:
                id: play_sound
                priority: false
                sound_file: !lambda return id(mute_switch_on_sound);
    on_release:
      - script.execute:
          id: play_sound
          priority: false
          sound_file: !lambda return id(mute_switch_off_sound);
      - microphone.unmute:
  - platform: mpr121
    id: volume_down
    channel: 0
    on_press:
      then:
        - light.turn_on: left_led
        - script.execute:
            id: set_volume
            volume: -0.05
        - delay: 750ms
        - while:
            condition:
              binary_sensor.is_on: volume_down
            then:
              - script.execute:
                  id: set_volume
                  volume: -0.05
              - delay: 150ms
    on_release:
      then:
        - light.turn_off: left_led

  - platform: mpr121
    id: volume_up
    channel: 2
    on_press:
      then:
        - light.turn_on: right_led
        - script.execute:
            id: set_volume
            volume: 0.05
        - delay: 750ms
        - while:
            condition:
              binary_sensor.is_on: volume_up
            then:
              - script.execute:
                  id: set_volume
                  volume: 0.05
              - delay: 150ms
    on_release:
      then:
        - light.turn_off: right_led

  - platform: mpr121
    id: action
    channel: 1
    on_click:
      - if:
          condition:
            or:
              - switch.is_off: use_wake_word
              - binary_sensor.is_on: hardware_mute_switch
          then:
            - logger.log:
                tag: "action_click"
                format: "Voice assistant is running: %s"
                args: ['id(va).is_running() ? "yes" : "no"']
            - if:
                condition: media_player.is_playing
                then:
                  - media_player.stop
            - if:
                condition: voice_assistant.is_running
                then:
                  - voice_assistant.stop:
                else:
                  - voice_assistant.start:
          else:
            - logger.log:
                tag: "action_click"
                format: "Voice assistant was running with wake word detection enabled. Starting continuously"
            - if:
                condition: media_player.is_playing
                then:
                  - media_player.stop
            - voice_assistant.stop
            - delay: 1s
            - script.execute: reset_led
            - script.wait: reset_led
            - voice_assistant.start_continuous:



light:
  # Hardware LED ring. Not used because remapping needed
  #
  # F7.3 (30.09.2026): GPIO21 treibt seit rev A2 **nicht mehr** LED1 unmittelbar, sondern
  #   U19 (74AHCT1G125GW, SOT-353, LCSC C12495) als Pegelwandler auf 5 V. Netze:
  #   GPIO21 -> LED_DATA_3V3 -> U19.2 (A); U19.4 (Y) -> LED_DATA_5V -> LED1.3 (DIN).
  #   OE liegt fest auf GND, VCC auf +5V mit C104 (100 nF).
  #   Grund (Befund 10): SK6805/SK6812 fordern VIH = 0,7 x VDD, bei 5 V also 3,5 V; der
  #   ESP32-S3 sichert nur VOH >= 0,8 x VDD = 2,64 V zu. Der AHCT-Eingang nimmt 2,0 V
  #   (TTL-Pegel), der Ausgang gibt >= 4,4 V. An der Firmware aendert sich nichts: der
  #   Wandler ist nicht invertierend, Zeitverhalten und Datenrichtung bleiben gleich.
  - platform: esp32_rmt_led_strip
    id: leds_internal
    pin: GPIO21
    # K-B3 (Pin-Audit 01.10.2026): eigene Zeiten statt chipset: SK6812. ESPHome setzt fuer
    # SK6812 T1H = 600 ns (esp32_rmt_led_strip/light.py Z. 46), die LEDs verlangen mehr:
    #   SK6812-EC20 (LED2..LED5):     T0H 0,20-0,40 | T0L >= 0,70 | T1H >= 0,70 | T1L >= 0,20 us
    #   SK6812D-EC3210R (LED1, LED6): T0H 0,20-0,40 | T0L >= 0,80 | T1H 0,65-1,00 | T1L >= 0,20 us
    # Gewaehlt (beide erfuellt, Periode 1,2 us, Vielfache von 100 ns):
    bit0_high: 300ns
    bit0_low: 900ns
    bit1_high: 800ns
    bit1_low: 400ns
    max_refresh_rate: 15ms
    num_leds: 6
    # Abschluss: rgb_order ist ab ESPHome 2026 veraltet (Entfernung 2027.3.0).
    channel_colors: GRB
    rmt_symbols: 192
    default_transition_length: 0ms
  - platform: partition
    id: left_led
    segments:
      - id: leds_internal
        from: 0
        to: 0
    default_transition_length: 100ms
  - platform: partition
    id: voice_assistant_leds
    # K-B2: alle 6 LEDs (0..5). Ueberlappt mit left_led (0) und right_led (5): laeuft ein
    # Effekt, ueberschreibt er die Touch-Rueckmeldung links/rechts im naechsten Takt; ohne
    # Effekt (Ruhe) zeigen left_led/right_led wie bisher den Tastendruck.
    segments:
      - id: leds_internal
        from: 0
        to: 5
    default_transition_length: 100ms
    effects:
      # F6: "Volume Display" wird in dieser Datei benutzt (Skript show_volume und
      #     Zeile mit effect: "Volume Display"), war aber nirgends definiert.
      #     Aus der Vorlage esphome/home-assistant-voice-pe (dev) uebernommen und seit
      #     K-B2 auf N LEDs umgerechnet (siehe unten).
      # K-B2 (Pin-Audit 01.10.2026): Die Effekte stammen aus dem 12er-Ring der Voice PE
      #     (esphome/home-assistant-voice-pe) und schrieben fest it[0..11]. Diese Partition hat
      #     weniger LEDs, und ESPHome prueft die Indizes nicht (partition/light_partition.h:61-80)
      #     -> Schreiben hinter den Puffer. Jetzt rechnet jeder Effekt mit N = it.size() und
      #     schreibt nur 0..N-1. Die Partition umfasst alle 6 LEDs der Platine (LED1..LED6,
      #     Index 0..5, von links nach rechts in einer Reihe, kein Ring):
      #     - Lauflicht statt Kreis: ein Kopf mit zwei Nachlauf-LEDs (192, 128).
      #     - Stumm (Mikrofon): aeusserste LEDs 0 und N-1 rot (Voice PE: 3 und 9 Uhr).
      #     - Lautstaerke 0: die beiden mittleren LEDs rot (Voice PE: 6 Uhr).
      #     "Volume Display" waechst von links nach rechts (Voice PE: ab 6 Uhr im Kreis).
      - addressable_lambda:
          name: "Volume Display"
          update_interval: 50ms
          lambda: |-
            const int n = it.size();
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            Color silenced_color(255, 0, 0);
            auto volume_ratio = float(n) * id(external_media_player).volume;
            for (int i = 0; i < n; i++) {
              if (i <= volume_ratio) {
                it[i] = color * min( 255.0f * (volume_ratio - i) , 255.0f ) ;
              } else {
                it[i] = Color::BLACK;
              }
            }
            if (id(external_media_player).volume == 0.0f) {
              it[0] = silenced_color;
            }
      - addressable_lambda:
          name: "Waiting for Command"
          update_interval: 100ms
          lambda: |-
            const int n = it.size();
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            const int head = id(global_led_animation_index) % n;
            for (int i = 0; i < n; i++) {
              if (i == head) {
                it[i] = color;
              } else if (i == (head + n - 1) % n) {
                it[i] = color * 192;
              } else if (i == (head + n - 2) % n) {
                it[i] = color * 128;
              } else {
                it[i] = Color::BLACK;
              }
            }
            id(global_led_animation_index) = (head + 1) % n;
      - addressable_lambda:
          name: "Listening For Command"
          update_interval: 50ms
          lambda: |-
            const int n = it.size();
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            const int head = id(global_led_animation_index) % n;
            for (int i = 0; i < n; i++) {
              if (i == head) {
                it[i] = color;
              } else if (i == (head + n - 1) % n) {
                it[i] = color * 192;
              } else if (i == (head + n - 2) % n) {
                it[i] = color * 128;
              } else {
                it[i] = Color::BLACK;
              }
            }
            id(global_led_animation_index) = (head + 1) % n;
      - addressable_lambda:
          name: "Thinking"
          update_interval: 10ms
          lambda: |-
            static uint8_t brightness_step = 0;
            static bool brightness_decreasing = true;
            static uint8_t brightness_step_number = 10;
            if (initial_run) {
              brightness_step = 0;
              brightness_decreasing = true;
            }
            const int n = it.size();
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            const int head = id(global_led_animation_index) % n;
            for (int i = 0; i < n; i++) {
              if (i == head || i == (head + n / 2) % n) {
                it[i] = color * uint8_t(255/brightness_step_number*(brightness_step_number-brightness_step));
              } else {
                it[i] = Color::BLACK;
              }
            }
            if (brightness_decreasing) {
              brightness_step++;
            } else {
              brightness_step--;
            }
            if (brightness_step == 0 || brightness_step == brightness_step_number) {
              brightness_decreasing = !brightness_decreasing;
            }
      - addressable_lambda:
          name: "Replying"
          update_interval: 50ms
          lambda: |-
            const int n = it.size();
            const int head = (id(global_led_animation_index) % n + n - 1) % n;
            id(global_led_animation_index) = head;
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            for (int i = 0; i < n; i++) {
              if (i == head) {
                it[i] = color;
              } else if (i == (head + 1) % n) {
                it[i] = color * 192;
              } else if (i == (head + 2) % n) {
                it[i] = color * 128;
              } else {
                it[i] = Color::BLACK;
              }
            }
      - addressable_lambda:
          name: "Muted or Silent"
          update_interval: 16ms
          lambda: |-
            const int n = it.size();
            Color muted_color(255, 0, 0);
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            for (int i = 0; i < n; i++) {
              if ( light_color.get_state() ) {
                it[i] = color;
              } else {
                it[i] = Color::BLACK;
              }
            }
            if ( id(master_mute_switch).state ) {
              it[0] = muted_color;
              it[n - 1] = muted_color;
            }
            if ( id(external_media_player).volume == 0.0f || id(external_media_player).is_muted() ) {
              it[n / 2 - 1] = muted_color;
              it[n / 2] = muted_color;
            }
      - addressable_lambda:
          name: "Voice kit startup failed"
          # update_interval: 16ms
          lambda: |-
            const int n = it.size();
            Color fail_color(255, 0, 0);
            for (int i = 0; i < n; i++) {
              if (i % 3) {
                it[i] = Color::BLACK;
              } else {
                it[i] = fail_color;
              }
            }
      - addressable_twinkle:
          name: "Twinkle"
          twinkle_probability: 50%
      - addressable_lambda:
          name: "Error"
          update_interval: 10ms
          lambda: |-
            static uint8_t brightness_step = 0;
            static bool brightness_decreasing = true;
            static uint8_t brightness_step_number = 10;
            if (initial_run) {
              brightness_step = 0;
              brightness_decreasing = true;
            }
            const int n = it.size();
            Color error_color(255, 0, 0);
            for (int i = 0; i < n; i++) {
              it[i] = error_color * uint8_t(255/brightness_step_number*(brightness_step_number-brightness_step));
            }
            if (brightness_decreasing) {
              brightness_step++;
            } else {
              brightness_step--;
            }
            if (brightness_step == 0 || brightness_step == brightness_step_number) {
              brightness_decreasing = !brightness_decreasing;
            }
      - addressable_lambda:
          name: "Timer Ring"
          update_interval: 10ms
          lambda: |-
            static uint8_t brightness_step = 0;
            static bool brightness_decreasing = true;
            static uint8_t brightness_step_number = 10;
            if (initial_run) {
              brightness_step = 0;
              brightness_decreasing = true;
            }
            const int n = it.size();
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            Color muted_color(255, 0, 0);
            for (int i = 0; i < n; i++) {
              it[i] = color * uint8_t(255/brightness_step_number*(brightness_step_number-brightness_step));
            }
            if ( id(master_mute_switch).state ) {
              it[0] = muted_color;
              it[n - 1] = muted_color;
            }
            if (brightness_decreasing) {
              brightness_step++;
            } else {
              brightness_step--;
            }
            if (brightness_step == 0 || brightness_step == brightness_step_number) {
              brightness_decreasing = !brightness_decreasing;
            }
      - addressable_lambda:
          name: "Timer Tick"
          update_interval: 100ms
          lambda: |-
            const int n = it.size();
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            Color muted_color(255, 0, 0);
            auto timer_ratio = float(n) * id(first_active_timer).seconds_left / max(id(first_active_timer).total_seconds , static_cast<uint32_t>(1));
            int last_led_on = static_cast<int>(ceil(timer_ratio)) - 1;
            const int head = id(global_led_animation_index) % n;
            for (int i = 0; i < n; i++) {
              float brightness_dip = ( i == head && i != last_led_on ) ? 0.9f : 1.0f ;
              if (i <= timer_ratio) {
                it[i] = color * min(255.0f * brightness_dip * (timer_ratio - i) , 255.0f * brightness_dip) ;
              } else {
                it[i] = Color::BLACK;
              }
            }
            if (id(master_mute_switch).state) {
              it[0] = muted_color;
              it[n - 1] = muted_color;
            }
            id(global_led_animation_index) = (head + n - 1) % n;

  - platform: partition
    id: led_ring
    name: LED-Ring
    entity_category: config
    icon: "mdi:circle-outline"
    # F6: 'effect: slow_pulse' wird an zwei Stellen auf led_ring angewandt (on_boot und
    #     im Ablauf bei Startfehler des voice_kit), der Effekt war aber nirgends
    #     definiert - damit liess sich die Konfiguration gar nicht uebersetzen.
    #     Auch die Vorlage (esphome/home-assistant-voice-pe, dev) kennt ihn nicht; er
    #     ist eine eigene Zutat, ebenso 'pulse' (on_boot, beim Verbinden mit der API).
    #     'pulse' bekommt ESPHomes Vorgabewerte. Bei 'slow_pulse' sind die 2 s meine
    #     Wahl - eine Vorlage gibt es nicht, und es betrifft allein das Aussehen der
    #     Anzeige beim Hochlauf.
    effects:
      - pulse:
          name: "pulse"
      - pulse:
          name: "slow_pulse"
          transition_length: 2s
          update_interval: 2s
      # 'listening_ww' wird beim Warten auf das Weckwort benutzt und war ebenfalls
      # nicht definiert. Eine Vorlage gibt es nicht. Der zugehoerige Schalter heisst
      # 'flicker_wake_word', deshalb hier ESPHomes eingebauter Effekt 'flicker' mit
      # seinen Vorgabewerten. Das ist eine Auslegung, keine Quelle.
      - flicker:
          name: "listening_ww"
    default_transition_length: 0ms
    restore_mode: RESTORE_DEFAULT_OFF
    initial_state:
      color_mode: rgb
      brightness: 66%
      red: 9.4%
      green: 73.3%
      blue: 94.9%
    segments:
      - id: leds_internal
        from: 0
        to: 5
  - platform: partition
    id: right_led
    segments:
      - id: leds_internal
        from: 5
        to: 5
    default_transition_length: 100ms

script:
  - id: enable_repeat_one
    then:
      # Turn on the repeat mode and pause for 500 ms between playlist items/repeats
      - lambda: |-
            id(external_media_player)
              ->make_call()
              .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_REPEAT_ONE)
              .set_announcement(true)
              .perform();
            id(external_media_player)->set_playlist_delay_ms(speaker::AudioPipelineType::ANNOUNCEMENT, 500);

  - id: ring_timer
    then:
      - script.execute: enable_repeat_one
      - script.execute:
          id: play_sound
          priority: true
          sound_file: !lambda return id(timer_finished_sound);

  - id: disable_repeat
    then:
      # Turn off the repeat mode and pause for 0 ms between playlist items/repeats
      - lambda: |-
            id(external_media_player)
              ->make_call()
              .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_REPEAT_OFF)
              .set_announcement(true)
              .perform();
            id(external_media_player)->set_playlist_delay_ms(speaker::AudioPipelineType::ANNOUNCEMENT, 0);

  - id: play_sound
    parameters:
      priority: bool
      sound_file: "audio::AudioFile*"
    then:
      - lambda: |-
          if (priority) {
            id(external_media_player)
              ->make_call()
              .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_STOP)
              .set_announcement(true)
              .perform();
          }
          if ( (id(external_media_player).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING ) || priority) {
            id(external_media_player)
              ->play_file(sound_file, true, false);
          }

  # Script used to fetch the first active timer (Stored in global first_active_timer)
  - id: reset_led
    then:
      - if:
          condition:
            - lambda: return id(notification);
          then:
            - light.turn_on:
                id: led_ring
                blue: 100%
                red: 100%
                green: 0%
                brightness: 100%
                effect: slow_pulse
          else:
            - if:
                condition:
                  and:
                    - switch.is_on: use_wake_word
                    - switch.is_on: flicker_wake_word
                    - binary_sensor.is_off: hardware_mute_switch
                then:
                  - light.turn_on:
                      id: led_ring
                      blue: 100%
                      red: 100%
                      green: 0%
                      brightness: 60%
                      effect: listening_ww
                else:
                  - light.turn_off: led_ring

  - id: turn_on_notification
    then:
      - lambda: id(notification) = true;
      - script.execute: reset_led

  - id: clear_notification
    then:
      - lambda: id(notification) = false;
      - script.execute: reset_led

  - id: set_volume
    mode: restart
    parameters:
      volume: float
    then:
      - media_player.volume_set:
          id: external_media_player
          volume: !lambda return clamp(id(external_media_player).volume+volume, 0.0f, 1.0f);

  - id: show_volume
    mode: restart
    then:
      # F6: rief effect: show_volume auf led_ring auf - diesen Effekt gibt es nicht.
      #     Die Vorlage loest dieselbe Aufgabe mit "Volume Display" auf
      #     voice_assistant_leds und nimmt Helligkeit und Farbe von led_ring.
      #     Hier genauso.
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: "Volume Display"
      - delay: 1s
      - script.execute: reset_led

  - id: turn_on_wake_word
    then:
      - if:
          condition:
            and:
              - binary_sensor.is_off: hardware_mute_switch
              - switch.is_on: use_wake_word
          then:
            - micro_wake_word.start
            - script.execute: reset_led
          else:
            - logger.log:
                tag: "turn_on_wake_word"
                format: "Trying to start listening for wake word, but %s"
                args:
                  [
                    'id(hardware_mute_switch).state ? "mute switch is on" : "use wake word toggle is off"',
                  ]
                level: "INFO"

  - id: turn_off_wake_word
    then:
      - micro_wake_word.stop
      - script.execute: reset_led

  - id: control_leds_voice_assistant_error_phase
    then:
      - light.turn_on:
          brightness: !lambda return min ( max( id(led_ring).current_values.get_brightness() , 0.2f ) + 0.1f , 1.0f );
          red: 1
          green: 0
          blue: 0
          id: voice_assistant_leds
          effect: "Error"

  - id: control_leds_voice_assistant_idle_phase
    then:
      - light.turn_off: voice_assistant_leds
      - if:
          condition:
            light.is_on: led_ring
          then:
            light.turn_on: led_ring

  # Script executed when the voice assistant is waiting for a command (After the wake word)
  # Slow clockwise spin of the LED ring.
  - id: control_leds_voice_assistant_waiting_for_command_phase
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: "Waiting for Command"

  # Script executed when the voice assistant is listening to a command
  # Fast clockwise spin of the LED ring.
  - id: control_leds_voice_assistant_listening_for_command_phase
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: "Listening For Command"

  # Script executed when the voice assistant is thinking to a command
  # The spin stops and the 2 LEDs that are currently on and blinking indicating the commend is being processed.
  - id: control_leds_voice_assistant_thinking_phase
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: "Thinking"

  # Script executed when the voice assistant is thinking to a command
  # Fast anticlockwise spin of the LED ring.
  - id: control_leds_voice_assistant_replying_phase
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: "Replying"

  - id: control_leds_muted_or_silent
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: "Muted or Silent"

  # Script executed when the voice assistant is not ready
  - id: control_leds_voice_assistant_not_ready_phase
    then:
      - light.turn_on:
          brightness: 66%
          red: 1
          green: 0
          blue: 0
          id: voice_assistant_leds
          effect: "Twinkle"

  - id: control_leds_timer_ticking
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: "Timer tick"

  - id: control_leds_timer_ringing
    then:
      - light.turn_on:
          brightness: !lambda return min ( max( id(led_ring).current_values.get_brightness() , 0.2f ) + 0.1f , 1.0f );
          id: voice_assistant_leds
          effect: "Timer Ring"

  - id: control_leds_dial_touched
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: "Volume Display"

  - id: fetch_first_active_timer
    then:
      # F6: get_timers() gibt seit ESPHome 2026.x einen std::vector<Timer> zurueck,
      #     nicht mehr eine Abbildung - '.second' gibt es damit nicht mehr. Woertlich
      #     aus der Vorlage esphome/home-assistant-voice-pe (dev) uebernommen.
      - lambda: |
          const auto &timers = id(va).get_timers();
          auto output_timer = *timers.begin();
          for (const auto &timer : timers) {
            if (timer.is_active && timer.seconds_left <= output_timer.seconds_left) {
              output_timer = timer;
            }
          }
          id(first_active_timer) = output_timer;

  - id: check_if_timers_active
    then:
      # F6: siehe oben - dieselbe Aenderung der Schnittstelle.
      - lambda: |
          const auto &timers = id(va).get_timers();
          bool output = false;
          for (const auto &timer : timers) {
            if (timer.is_active) {
              output = true;
            }
          }
          id(is_timer_active) = output;

  - id: control_leds
    then:
      - lambda: |
          if (id(voice_kit_component).is_failed()) {
            id(control_leds_voice_kit_startup_failed).execute();
            return;
          }
          id(check_if_timers_active).execute();
          if (id(is_timer_active)){
            id(fetch_first_active_timer).execute();
          }
          if (id(improv_ble_in_progress)) {
            id(control_leds_improv_ble_state).execute();
          } else if (id(init_in_progress)) {
            id(control_leds_init_state).execute();
          } else if (!id(wifi_id).is_connected() || !id(api_id).is_connected()){
            id(control_leds_no_ha_connection_state).execute();
          } else if (id(timer_ringing).state) {
            id(control_leds_timer_ringing).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_waiting_for_command_phase_id}) {
            id(control_leds_voice_assistant_waiting_for_command_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_listening_for_command_phase_id}) {
            id(control_leds_voice_assistant_listening_for_command_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_thinking_phase_id}) {
            id(control_leds_voice_assistant_thinking_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_replying_phase_id}) {
            id(control_leds_voice_assistant_replying_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_error_phase_id}) {
            id(control_leds_voice_assistant_error_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_not_ready_phase_id}) {
            id(control_leds_voice_assistant_not_ready_phase).execute();
          } else if (id(is_timer_active)) {
            id(control_leds_timer_ticking).execute();
          } else if (id(master_mute_switch).state) {
            id(control_leds_muted_or_silent).execute();
          } else if (id(external_media_player).volume == 0.0f || id(external_media_player).is_muted()) {
            id(control_leds_muted_or_silent).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_idle_phase_id}) {
            id(control_leds_voice_assistant_idle_phase).execute();
          }

  # Script executed if voice_kit startup failed
  # Static red "X"
  - id: control_leds_voice_kit_startup_failed
    then:
      - light.turn_on:
          brightness: 40%
          red: 0%
          green: 0%
          blue: 0%
          id: voice_assistant_leds
          effect: "Voice kit startup failed"

  # Script executed during Improv BLE
  # Warm White Twinkle
  - id: control_leds_improv_ble_state
    then:
      - light.turn_on:
          brightness: 66%
          red: 100%
          green: 89%
          blue: 71%
          id: voice_assistant_leds
          effect: "Twinkle"

  # Script executed during initialization
  # Blue Twinkle if Wifi is connected, Else solid warm white
  - id: control_leds_init_state
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - light.turn_on:
                brightness: 66%
                red: 9.4%
                green: 73.3%
                blue: 94.9%
                id: voice_assistant_leds
                effect: "Twinkle"
          else:
            - light.turn_on:
                brightness: 66%
                red: 100%
                green: 89%
                blue: 71%
                id: voice_assistant_leds
                effect: "none"

  # Script executed when the device has no connection to Home Assistant
  # Red Twinkle (This will be visible during HA updates for example)
  - id: control_leds_no_ha_connection_state
    then:
      - light.turn_on:
          brightness: 66%
          red: 1
          green: 0
          blue: 0
          id: voice_assistant_leds
          effect: "Twinkle"

  - id: activate_stop_word_once
    then:
      - delay: 1s
      # Enable stop wake word
      - if:
          condition:
            switch.is_off: timer_ringing
          then:
            - micro_wake_word.enable_model: stop
            - wait_until:
                not:
                  media_player.is_announcing:
            - if:
                condition:
                  switch.is_off: timer_ringing
                then:
                  - micro_wake_word.disable_model: stop

voice_kit:
  id: voice_kit_component
  i2c_id: internal_i2c
  # C7 (Weg 2, 21.09.2026): XU316_RST liegt an GPIO46 (U8.52 -> R47 100R ->
  #     Gate Q2 LBSS138 -> RST_N des XU316; GPIO high = XU316 im Reset).
  #     Schaltplan an das vorhandene Layout angeglichen; GPIO17 (U8.23) ist frei:
  #     am rechten ESP32-Rand ist fuer GPIO17 und AUDIO_PA_EN (GPIO18) nur ein
  #     Via-Platz frei.
  #     GPIO46 ist Strapping-Pin (ESP32-S3 Datenblatt v2.2, Tab. 3-1: interner
  #     Pull-down, Bitwert 0; Tab. 3-3: nur GPIO0=1/beliebig und GPIO0=0/GPIO46=0
  #     sind Boot-Modi). Extern haengt an GPIO46 nur R47 und dahinter R48 470k
  #     nach GND - kein Pull-up, der Pin liest beim Reset 0. Ausgang ist
  #     moeglich (Tab. 2-4 IO MUX, S. 22: GPIO46 I/O/T).
  reset_pin:
    number: GPIO46
    # Auch xmos_flasher schaltet GPIO46 (Reset des XU316 und Busumschalter U16 haengen an
    # demselben Netz XU316_RST).
    allow_other_uses: true
  firmware:
    url: https://github.com/esphome/voice-kit-xmos-firmware/releases/download/v1.3.1/ffva_v1.3.1_upgrade.bin
    version: "1.3.1"
    md5: 964635c5bf125529dab14a2472a15401

# Bus-Flasher fuer den XU316 (firmware/esphome/components/xmos_flasher, Herkunft Satellite1-ESPHome).
# Schreibt das Werksabbild in U11, wenn dieser leer oder beschaedigt ist; danach Neustart, voice_kit
# liest die Version und haelt sie per DFU aktuell. Bus: CLK GPIO3 und D0 GPIO4 fest am XU316-QSPI,
# CS_N GPIO39 und MISO GPIO40 ueber U16; GPIO46 hoch = XU316 im Reset und U16 auf den ESP32.
xmos_flasher:
  id: xmos_flasher_component
  image_file: firmware/xmos/ffva_v1.3.1_factory.bin
  md5_file: firmware/xmos/MD5SUMS
  reset_pin:
    number: GPIO46
    allow_other_uses: true
  frequency: 4MHz
  progress:
    name: "XMOS-Flash Fortschritt"
  status:
    name: "XMOS-Flash Status"
  on_success:
    - logger.log: "XMOS-Werksabbild geschrieben und geprueft - Neustart"
    - delay: 3s
    - lambda: 'App.safe_reboot();'
  on_failure:
    - logger.log:
        level: ERROR
        format: "XMOS-Flash fehlgeschlagen (Status-Sensor nennt die Stelle)"

external_components:
  # Pin-Audit U10-B7: GPIO3 und GPIO4 haengen ohne Trennung an QSPI_CLK und QSPI_D0 des
  # XU316 (U16 schaltet nur CS und D1). Beide muessen in dieser Datei unbenutzt bleiben
  # (hochohmig), sonst stoeren sie Boot und Flashzugriff des XU316. Die Voice PE nutzt
  # GPIO3 fuer den Stummschalter - nicht uebernehmen.
  - source:
      type: git
      url: https://github.com/esphome/home-assistant-voice-pe
      # Audit A4.4b: fester Stand statt 'dev' - der Commit, mit dem diese Datei unter
      # ESPHome 2026.9.0 uebersetzt wurde (Zweig dev, 01.10.2026).
      ref: d4e6fa43d6a1a7d342b7d4d403567e06516719de
    components:
      - voice_kit
    refresh: 0s
  # F1: Baustein fuer den TAS5805M, siehe audio_dac weiter unten.
  # K-B4 (Pin-Audit 01.10.2026): lokale, gepatchte Kopie von mrtoy-me/esphome-tas58xx,
  #     Stand 89f29cfd687200e908a6459404abfbb513adb17d (Zweig main = neuester Stand am
  #     01.10.2026). Zwei Aenderungen, beschrieben in firmware/esphome/PATCH.md:
  #     Registertabelle endet in Hi-Z statt PLAY, Steuerzustand initialisiert. Damit geht
  #     die Endstufe erst nach PBTL und analog_gain auf PLAY.
  #     Lizenz: GPL-3.0-or-later (Upstream-README: Grundlage ist GPL-3.0-Code von Andriy
  #     Malyshenko/sonocotta; das Repository selbst hat keine Lizenzdatei). Urheber und
  #     Aenderungen sind in REUSE.toml und in den geaenderten Dateien vermerkt.
  - source:
      type: local
      path: firmware/esphome/components
    components:
      - tas58xx
      - xmos_flasher

# --- F1 (Befund 15 / B4): Endstufe TAS5805M ansteuern -------------------------
# Die Konfiguration des Betreibers steuerte den Verstaerker ueberhaupt nicht an.
# Zwei Folgen: DAMP_PBTL blieb auf dem Vorgabewert 0 (BTL), obwohl die Platine als
# PBTL verdrahtet ist - und /PDN blieb durch R71 nach Masse gezogen, die Endstufe
# waere also nie aus dem Ruhezustand gekommen.
#
# ESPHome selbst bringt keinen Baustein dafuer mit: unter audio_dac gibt es nur
# aic3204, es8311, es8388 und pcm5122. Der externe Baustein tas58xx bietet PBTL
# als eigene Option - Register 0x02h von Hand zu schreiben ist nicht noetig.
# Er setzt DEVICE_CTRL_1 (0x02) Bit 2 im Lesen-Aendern-Schreiben.
# K-B4 (Pin-Audit 01.10.2026): Die fruehere Aussage "schaltet die Endstufe erst danach
# auf PLAY" war falsch - im Original schreibt die Registertabelle (tas58xx_minimal.h)
# schon 0x03 = 0x03 (PLAY) mit 0x02 = 0x00 (BTL) und 0x54 = 0x00 (0 dB), PBTL und
# -12 dB folgten erst danach. Mit dem Patch (firmware/esphome/PATCH.md) bleibt die
# Tabelle in Hi-Z; PLAY setzt configure_registers_() nach dac_mode und analog_gain.
#
# Lizenz des Bausteins: GPL-3.0-or-later, siehe external_components und REUSE.toml.
audio_dac:
  - platform: tas58xx
    id: tas5805m_dac
    i2c_id: internal_i2c
    address: 0x2C          # B1: R70 legt ADR auf 0x2C; der Baustein setzt sonst 0x2D
    tas58xx_dac: TAS5805M
    enable_pin: GPIO18     # AUDIO_PA_EN -> U14.12 /PDN
    # K-B5 (Pin-Audit 01.10.2026): erst nach voice_kit einrichten. tas58xx hat
    # Prioritaet IO (900, tas58xx.h Z. 28), voice_kit HARDWARE - 1 (799, voice_kit.h
    # Z. 130) - bisher wurde der DSP freigegeben und danach der XU316 (Taktquelle)
    # zurueckgesetzt.
    # B5-B2 (02.10.2026): PLAY ist an die Bereitschaft des XU316 gekoppelt, und zwar
    # ueber die Statusabfrage von voice_kit, die ESPHome selbst auswertet:
    #   - ESPHome 2026.9.0 Application::setup() (core/application.cpp Z. 64-65, 78-102)
    #     richtet die Komponenten nach Prioritaet ein und wartet nach jeder, bis deren
    #     can_proceed() true liefert.
    #   - VoiceKit::can_proceed() (voice_kit.h Z. 127, d4e6fa4) ist erst true, wenn die
    #     XU316-Version per I2C gelesen ist und passt (bzw. das DFU-Update fertig ist):
    #     voice_kit.cpp Z. 19-37 pulst den Reset und liest die Version nach 3 s.
    #   - tas58xx mit Prioritaet 790 (< 799) wird deshalb erst danach eingerichtet - die
    #     FFVA-Firmware laeuft dann und gibt BCLK/LRCLK aus. Bis dahin haelt R71 /PDN
    #     tief: der TAS5805M ist abgeschaltet, seine Ausgaenge hochohmig. Die Folge
    #     entspricht SLASEH5D 7.5.3.1 (PDN, 5 ms, Takte stabil, Hi-Z, DSP, PLAY).
    #   Einzige Ausnahme: ist voice_kit fehlgeschlagen (is_failed, kein XU316), geht die
    #   Einrichtung ohne Takte weiter; der Baustein bleibt dann im Clock-Error/Hi-Z
    #   (7.3.4) - ohne XU316 gibt es ohnehin keinen Ton.
    # Nachweis bei der Inbetriebnahme bleibt: nach dem Start Register 0x71 = 0 und Ton,
    # im Log "[tas58xx]"-Einrichtung erst nach "[voice_kit] DFU version" (HANDGRIFFE 2a).
    setup_priority: 790
    dac_mode: PBTL         # DEVICE_CTRL_1 Bit 2 = DAMP_PBTL
    mixer_mode: LEFT       # PBTL nutzt den linken I2S-Rahmen. Pin-Audit K-B7/U14-B3:
                           # tas58xx schreibt den Mischer nur nach refresh_eq_settings(),
                           # das allein EQ-Entitaeten ausloesen - diese YAML hat keine.
                           # Es bleibt der Bausteinstandard (L->L, R->R); der Ton kommt
                           # trotzdem, weil der ESP32 mono in beide Slots schreibt.
                           # Die Angabe ist Pflicht fuer PBTL (validate_config).
    modulation: BD_MODE
    # GRENZE - nicht ueber -12dB einstellen (also nicht -11dB, -6dB, 0dB ...):
    #   Die analoge Verstaerkung legt die Vollaussteuerung fest (Skala auf 29,5 V,
    #   SLASEH5D Tab. 7-2). -12dB -> 7,41 V Spitze an 4 Ohm -> ~1,85 A Spitzenstrom
    #   durch L6/L7. Darueber gehen die Ausgangsdrosseln in die Saettigung
    #   (XAL4040: Isat 3,0 A; seit dem Ersatz MTQH404030S100MBT Isat 4,9 A - die
    #   Grenze bleibt trotzdem, sie schuetzt auch den 40-mm-Treiber). Siehe B3.
    analog_gain: -12dB
    # B3: Die Skala der analogen Verstaerkung bezieht sich laut Tabelle 7-2 des
    # Datenblatts (SLASEH5D, S. 34) auf 29,5 V Spitze, NICHT auf PVDD. -6 dB
    # ergaebe 14,79 V und wuerde bei PVDD = 14 V gar nichts begrenzen.
    # -12 dB gibt 7,41 V Spitze, an 4 Ohm also rund 1,85 A und 6,9 W - damit
    # bleibt L6/L7 (MTQH404030S100MBT, I_sat 4,9 A) im sicheren Bereich und der
    # 40-mm-Treiber wird nicht ueberlastet. Bei der Inbetriebnahme nur die
    # digitale Lautstaerke abstimmen, diesen Wert nicht erhoehen (B7).

i2s_audio:
  - id: i2s_output
    # E5d (28.09.2026) kehrt den Datenweg von C3 um: U14.8 (SDIN) haengt jetzt am
    #     Netz I2S_DIN_SEC, also unmittelbar an GPIO10 des ESP32. Der Weg ist
    #     GPIO10 -> R24 -> I2S_DIN_SEC -> U14.8 (SDIN) und, an derselben Leitung,
    #     -> R40 -> X1D00 in den XU316 als Bezug fuer die Echoausloeschung.
    #     X1D34 (U10.53) treibt seitdem kein Ziel mehr; R25 ist seit E5c-P5 entfernt.
    #     Die Takte kommen weiter aus dem XU316 (C1: X1D01 -> I2S_LRCK,
    #     C2: X1D10 -> I2S_BCLK); nur die Datenleitung ist umgehaengt.
    # C5: Der XU316 ist Taktgeber, der ESP32 bleibt auf beiden Bussen secondary.
    # C6: Kein MCLK-Pin erklaert - am Knoten I2S_MCLK darf nur eine Seite treiben.
    #     R23 und R26 gibt es in rev A2 nicht mehr: I2S_MCLK laeuft nur innerhalb des
    #     XU316 (X1D11 -> R31 -> R44 -> X0D36), der ESP32 haengt nicht daran.
    i2s_lrclk_pin:
      number: GPIO7
    i2s_bclk_pin:
      number: GPIO8

  - id: i2s_input
    # data line is GPIO15
    i2s_lrclk_pin:
      number: GPIO14
    i2s_bclk_pin:
      number: GPIO13

microphone:
  - platform: i2s_audio
    id: i2s_mics
    i2s_din_pin: GPIO15
    adc_type: external
    pdm: false
    sample_rate: 16000
    bits_per_sample: 32bit
    i2s_mode: secondary
    i2s_audio_id: i2s_input
    channel: stereo

speaker:
  - platform: i2s_audio
    id: i2s_audio_speaker
    # E5d: 48 kHz und 32 Bit, damit der Bustakt zum TAS5805M passt.
    sample_rate: 48000
    i2s_mode: secondary
    i2s_dout_pin: GPIO10
    bits_per_sample: 32bit
    i2s_audio_id: i2s_output
    dac_type: external
    channel: mono
    timeout: never
    buffer_duration: 100ms

  # Virtual speakers to combine the announcement and media streams together into one output
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_audio_speaker
    num_channels: 1
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  # Vritual speakers to resample each pipelines' audio, if necessary, as the mixer speaker requires the same sample rate
  # K-B1 (Pin-Audit 01.10.2026): alle Stufen auf 48000 Hz wie i2s_audio_speaker. Der
  # Lautsprecher ist I2S-Slave (Takt vom XU316, 48 kHz) und lehnt jede andere Rate ab
  # (i2s_audio_speaker_standard.cpp Z. 368-372: "Incompatible stream settings") - mit
  # 44100 Hz kam kein Ton. Voice PE (d4e6fa4) nutzt an diesen vier Stellen ebenfalls 48000.
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

media_player:
  - platform: speaker
    id: external_media_player
    name: Medienwiedergabe
    internal: False
    volume_increment: 0.05
    volume_min: 0.4
    volume_max: 0.85
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC     # FLAC is the least processor intensive codec
      num_channels: 1  # Stereo audio is unnecessary for announcements
      sample_rate: 48000
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC     # FLAC is the least processor intensive codec
      num_channels: 1
      sample_rate: 48000
    on_mute:
      - script.execute: control_leds
    on_unmute:
      - script.execute: control_leds
    on_volume:
      - script.execute: control_leds
    on_announcement:
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s
    on_state:
      if:
        condition:
          and:
            - switch.is_off: timer_ringing
            - not:
                voice_assistant.is_running:
            - not:
                media_player.is_announcing:
        then:
          - mixer_speaker.apply_ducking:
              id: media_mixing_input
              decibel_reduction: 0
              duration: 1.0s
    # K-B8: Toene fest auf Voice PE d4e6fa4 (Inhalt identisch mit Zweig dev am 02.10.2026).
    #     ESPHome prueft fuer files keine Pruefsumme; der Commit legt den Inhalt fest.
    files:
      - id: center_button_press_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/d4e6fa43d6a1a7d342b7d4d403567e06516719de/sounds/center_button_press.flac
      - id: center_button_double_press_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/d4e6fa43d6a1a7d342b7d4d403567e06516719de/sounds/center_button_double_press.flac
      - id: center_button_triple_press_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/d4e6fa43d6a1a7d342b7d4d403567e06516719de/sounds/center_button_triple_press.flac
      - id: center_button_long_press_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/d4e6fa43d6a1a7d342b7d4d403567e06516719de/sounds/center_button_long_press.flac
      - id: factory_reset_initiated_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/d4e6fa43d6a1a7d342b7d4d403567e06516719de/sounds/factory_reset_initiated.mp3
      - id: factory_reset_cancelled_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/d4e6fa43d6a1a7d342b7d4d403567e06516719de/sounds/factory_reset_cancelled.mp3
      - id: factory_reset_confirmed_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/d4e6fa43d6a1a7d342b7d4d403567e06516719de/sounds/factory_reset_confirmed.mp3
      - id: jack_connected_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/d4e6fa43d6a1a7d342b7d4d403567e06516719de/sounds/jack_connected.flac
      - id: jack_disconnected_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/d4e6fa43d6a1a7d342b7d4d403567e06516719de/sounds/jack_disconnected.flac
      - id: mute_switch_on_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/d4e6fa43d6a1a7d342b7d4d403567e06516719de/sounds/mute_switch_on.flac
      - id: mute_switch_off_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/d4e6fa43d6a1a7d342b7d4d403567e06516719de/sounds/mute_switch_off.flac
      - id: timer_finished_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/d4e6fa43d6a1a7d342b7d4d403567e06516719de/sounds/timer_finished.flac
      - id: wake_word_triggered_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/d4e6fa43d6a1a7d342b7d4d403567e06516719de/sounds/wake_word_triggered.flac
      - id: easter_egg_tick_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/d4e6fa43d6a1a7d342b7d4d403567e06516719de/sounds/easter_egg_tick.mp3
      - id: easter_egg_tada_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/d4e6fa43d6a1a7d342b7d4d403567e06516719de/sounds/easter_egg_tada.mp3
      - id: error_cloud_expired
        file: https://github.com/esphome/home-assistant-voice-pe/raw/d4e6fa43d6a1a7d342b7d4d403567e06516719de/sounds/error_cloud_expired.mp3

micro_wake_word:
  id: mww
  microphone:
    microphone: i2s_mics
    channels: 1
    gain_factor: 4
  stop_after_detection: false
  # K-B9: hey_jarvis, hey_mycroft, vad fest auf esphome/micro-wake-word-models 40ff33f.
  #     okay_nabu und stop gibt es nur als Release-Anhang (GitHub: "immutable": false);
  #     ESPHome prueft keine Pruefsumme. Soll-sha256 (.esphome/micro_wake_word/<hash>/):
  #     okay_nabu.json   f8026e2ce93a0855ca23483036fd2d74ee924a2588d9ea6a6c6c7478fbf4be57
  #     okay_nabu.tflite d89128c4d16a72de429119fb2254ce46649553c2a24f5dd840175c80d7b9d094
  #     stop.json        bd13aeb1b83852649dc4fb6135cb160ff68716d14612b06f6a405342c57447aa
  #     stop.tflite      b5a18c4ad681a89950dfade31011e1631bdcb333e93c84519a1a63ff4f071146
  models:
    - model: https://github.com/kahrendt/microWakeWord/releases/download/okay_nabu_20241226.3/okay_nabu.json
      id: okay_nabu
    - model: https://github.com/esphome/micro-wake-word-models/raw/40ff33f57f8fc6ad71a75ef085abbf742495b225/models/v2/hey_jarvis.json
      id: hey_jarvis
    - model: https://github.com/esphome/micro-wake-word-models/raw/40ff33f57f8fc6ad71a75ef085abbf742495b225/models/v2/hey_mycroft.json
      id: hey_mycroft
    - model: https://github.com/kahrendt/microWakeWord/releases/download/stop/stop.json
      id: stop
      internal: true
  vad:
    model: https://github.com/esphome/micro-wake-word-models/raw/40ff33f57f8fc6ad71a75ef085abbf742495b225/models/v2/vad.json
  on_wake_word_detected:
    # If the wake word is detected when the device is muted (Possible with the software mute switch): Do nothing
    - if:
        condition:
          switch.is_off: master_mute_switch
        then:
          # If a timer is ringing: Stop it, do not start the voice assistant (We can stop timer from voice!)
          - if:
              condition:
                switch.is_on: timer_ringing
              then:
                - switch.turn_off: timer_ringing
              # Stop voice assistant if running
              else:
                - if:
                    condition:
                      voice_assistant.is_running:
                    then:
                      voice_assistant.stop:
                    # Stop any other media player announcement
                    else:
                      - if:
                          condition:
                            media_player.is_announcing:
                          then:
                            - media_player.stop:
                                announcement: true
                          # Start the voice assistant and play the wake sound, if enabled
                          else:
                            - if:
                                condition:
                                  switch.is_on: wake_sound
                                then:
                                  - script.execute:
                                      id: play_sound
                                      priority: true
                                      sound_file: !lambda return id(wake_word_triggered_sound);
                                  - delay: 300ms
                            - voice_assistant.start:
                                wake_word: !lambda return wake_word;

select:
  - platform: template
    name: "Empfindlichkeit für das Weckwort"
    optimistic: true
    initial_option: Slightly sensitive
    restore_value: true
    entity_category: config
    options:
      - Slightly sensitive
      - Moderately sensitive
      - Very sensitive
    on_value:
      # Sets specific wake word probabilities computed for each particular model
      # Note probability cutoffs are set as a quantized uint8 value, each comment has the corresponding floating point cutoff
      # False Accepts per Hour values are tested against all units and channels from the Dinner Party Corpus.
      # These cutoffs apply only to the specific models included in the firmware: okay_nabu@20241226.3, hey_jarvis@v2, hey_mycroft@v2
      lambda: |-
        if (x == "Slightly sensitive") {
          id(okay_nabu).set_probability_cutoff(217);    // 0.85 -> 0.000 FAPH on DipCo (Manifest's default)
          id(hey_jarvis).set_probability_cutoff(247);   // 0.97 -> 0.563 FAPH on DipCo (Manifest's default)
          id(hey_mycroft).set_probability_cutoff(253);  // 0.99 -> 0.567 FAPH on DipCo
        } else if (x == "Moderately sensitive") {
          id(okay_nabu).set_probability_cutoff(176);    // 0.69 -> 0.376 FAPH on DipCo
          id(hey_jarvis).set_probability_cutoff(235);   // 0.92 -> 0.939 FAPH on DipCo
          id(hey_mycroft).set_probability_cutoff(242);  // 0.95 -> 1.502 FAPH on DipCo (Manifest's default)
        } else if (x == "Very sensitive") {
          id(okay_nabu).set_probability_cutoff(143);    // 0.56 -> 0.751 FAPH on DipCo
          id(hey_jarvis).set_probability_cutoff(212);   // 0.83 -> 1.502 FAPH on DipCo
          id(hey_mycroft).set_probability_cutoff(237);  // 0.93 -> 1.878 FAPH on DipCo
        }

voice_assistant:
  id: va
  # K-B14: Kanal 0 = AEC+IC+NS+AGC, Kanal 1 = AEC+IC+NS (voice_kit channel_1_stage: NS).
  #     Mit zwei Quellen meldet das Geraet MULTI_CHANNEL_AUDIO; Home Assistant nimmt dann
  #     Kanal 1 fuer STT-Dienste, die AGC und NS abwaehlen (wie Voice PE d4e6fa4).
  microphone:
    - microphone: i2s_mics
      channels: 0
    - microphone: i2s_mics
      channels: 1
  media_player: external_media_player
  micro_wake_word: mww
  use_wake_word: false
  noise_suppression_level: 0
  auto_gain: 0 dbfs
  volume_multiplier: 1
  on_client_connected:
    # Wie Voice PE (va_connected_wait_for_ble): erst wenn BLE aus ist.
    - wait_until:
        not: ble.enabled
    - delay: 2s
    - lambda: id(init_in_progress) = false;
    - micro_wake_word.start:
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds
  on_client_disconnected:
    - voice_assistant.stop:
    - lambda: id(voice_assistant_phase) = ${voice_assist_not_ready_phase_id};
    - script.execute: control_leds
  on_error:
    # Only set the error phase if the error code is different than duplicate_wake_up_detected or stt-no-text-recognized
    # These two are ignored for a better user experience
    - if:
        condition:
          and:
            - lambda: return !id(init_in_progress);
            - lambda: return code != "duplicate_wake_up_detected";
            - lambda: return code != "stt-no-text-recognized";
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_error_phase_id};
          - script.execute: control_leds
    # If the error code is cloud-auth-failed, serve a local audio file guiding the user.
    - if:
        condition:
          - lambda: return code == "cloud-auth-failed";
        then:
          - script.execute:
              id: play_sound
              priority: true
              sound_file: !lambda return id(error_cloud_expired);
  # When the voice assistant starts: Play a wake up sound, duck audio.
  on_start:
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 20  # Number of dB quieter; higher implies more quiet, 0 implies full volume
        duration: 0.0s         # The duration of the transition (default is no transition)
  on_listening:
    - lambda: id(voice_assistant_phase) = ${voice_assist_waiting_for_command_phase_id};
    - script.execute: control_leds
  on_stt_vad_start:
    - lambda: id(voice_assistant_phase) = ${voice_assist_listening_for_command_phase_id};
    - script.execute: control_leds
  on_stt_vad_end:
    - lambda: id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
    - script.execute: control_leds
  on_intent_progress:
    - if:
        condition:
          # A nonempty x variable means a streaming TTS url was sent to the media player
          lambda: 'return !x.empty();'
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
          - script.execute: control_leds
          # Start a script that would potentially enable the stop word if the response is longer than a second
          - script.execute: activate_stop_word_once
  on_tts_start:
    - if:
        condition:
          # The intent_progress trigger didn't start the TTS Reponse
          lambda: 'return id(voice_assistant_phase) != ${voice_assist_replying_phase_id};'
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
          - script.execute: control_leds
          # Start a script that would potentially enable the stop word if the response is longer than a second
          - script.execute: activate_stop_word_once
  # When the voice assistant ends ...
  on_end:
    - wait_until:
        not:
          voice_assistant.is_running:
    # Stop ducking audio.
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 0
        duration: 1.0s
    # If the end happened because of an error, let the error phase on for a second
    - if:
        condition:
          lambda: return id(voice_assistant_phase) == ${voice_assist_error_phase_id};
        then:
          - delay: 1s
    # Reset the voice assistant phase id and reset the LED animations.
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds
  on_timer_finished:
    - switch.turn_on: timer_ringing
  on_timer_started:
    - script.execute: control_leds
  on_timer_cancelled:
    - script.execute: control_leds
  on_timer_updated:
    - script.execute: control_leds
  on_timer_tick:
    - script.execute: control_leds



