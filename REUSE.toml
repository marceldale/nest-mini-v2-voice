# --- Third-party 3D models and footprints ---------------------------------------------------
# These came from the component manufacturers and from library portals. Their terms are
# **not established**: most vendor 3D models are published for use in designs without a
# stated licence, and we have no document for any of them. They are kept here because the
# board references them 30 times and the design cannot be rendered without them.
#
# If you redistribute this repository, this is the directory to check. Nothing in `parts/`
# is covered by our licence, and we grant no rights in it.
[[annotations]]
path = ["parts/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["NOASSERTION - see the note above; each file comes from its component manufacturer"]
SPDX-License-Identifier = "LicenseRef-Vendor-Model-Terms-Not-Established"

