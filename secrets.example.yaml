#
# Template for secrets.yaml, which nest-mini-v2-voice.yaml reads with !secret and which is not
# part of this repository. Copy this file to secrets.yaml next to the YAML and fill in your values.
# These are all !secret keys the YAML uses.

# Wi-Fi (wifi: ssid / password, and the fallback access point's password)
ssid: "YOUR_WIFI_SSID"
wifi_pass: "YOUR_WIFI_PASSWORD"

# Home Assistant native API encryption key (api: encryption: key), 32 random bytes in base64.
# The value below is the base64 of the public text "REPLACE-ME-PUBLIC-PLACEHOLDER-32": it only makes
# the file pass `esphome config` and protects nothing - replace it. Generate a real key, e.g. with:
#   python -c "import base64,os;print(base64.b64encode(os.urandom(32)).decode())"
api_key: "UkVQTEFDRS1NRS1QVUJMSUMtUExBQ0VIT0xERVItMzI="
